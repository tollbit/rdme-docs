openapi: 3.0.0
info:
  title: TollBit Subdomains
  version: 0.0.0
tags:
  - name: Tollbit Subdomain
paths:
  /{path}:
    get:
      operationId: TollbitSubdomain_getContent
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TollBit.Apis.GetContentResponse'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TollBit.Apis.ProblemJSON'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TollBit.Apis.ProblemJSON'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TollBit.Apis.ProblemJSON'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TollBit.Apis.ProblemJSON'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TollBit.Apis.ProblemJSON'
      tags:
        - Tollbit Subdomain
      security:
        - SubdomainAccessToken: []
components:
  schemas:
    TollBit.Apis.ContentMetadata:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        imageUrl:
          type: string
        author:
          type: string
        published:
          type: string
        modified:
          type: string
    TollBit.Apis.ContentRate:
      type: object
      required:
        - price
        - license
      properties:
        price:
          $ref: '#/components/schemas/TollBit.Apis.RatePrice'
        license:
          $ref: '#/components/schemas/TollBit.Apis.RateLicenseResponse'
    TollBit.Apis.GetContentResponse:
      type: object
      required:
        - content
        - metadata
      properties:
        content:
          $ref: '#/components/schemas/TollBit.Apis.PageContent'
        metadata:
          $ref: '#/components/schemas/TollBit.Apis.ContentMetadata'
        rate:
          $ref: '#/components/schemas/TollBit.Apis.ContentRate'
    TollBit.Apis.PageContent:
      type: object
      required:
        - header
        - body
        - footer
      properties:
        header:
          type: string
        body:
          type: string
        footer:
          type: string
    TollBit.Apis.ProblemJSON:
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
      additionalProperties: {}
    TollBit.Apis.RateLicensePermission:
      type: object
      required:
        - name
      properties:
        name:
          type: string
    TollBit.Apis.RateLicenseResponse:
      type: object
      required:
        - id
        - licenseType
        - licensePath
        - permissions
      properties:
        id:
          type: string
        licenseType:
          type: string
        licensePath:
          type: string
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/TollBit.Apis.RateLicensePermission'
    TollBit.Apis.RatePrice:
      type: object
      required:
        - priceMicros
        - currency
      properties:
        priceMicros:
          type: integer
          format: int64
        currency:
          type: string
  securitySchemes:
    SubdomainAccessToken:
      type: http
      scheme: Bearer
      description: >-
        To access content on a TollBit subdomain, you will need an access token.
        This token is a JWT that is signed by TollBit and includes information
        about the subdomain and the permissions granted to the token.


        You can obtain the token by calling the TokensService to create a
        Content Access Token. Once you have the token, you can include it in the
        Authorization header of your requests to the subdomain.
servers:
  - url: https://tollbit.example.com
    description: TollBit subdomain of your favorite site
    variables: {}
